      # - name: Push image to GHCR
      #   run: |
      #     docker tag ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tag }} \
      #       ${{ steps.tags.outputs.ghcr }}
      #     docker push ${{ steps.tags.outputs.ghcr }}