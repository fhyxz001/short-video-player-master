name: Docker Export (Offline Image)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for the image"
        required: false
        default: "latest"
  push:
    branches: [main, master]

env:
  IMAGE_NAME: video-player
  REGISTRY: ghcr.io

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: tags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            SHORT_SHA="${{ github.sha }}" && SHORT_SHA="${SHORT_SHA::7}"
            TAG="sha-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────
      # Build image
      # ──────────────────────────────────────────────

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # ──────────────────────────────────────────────
      # Export offline tarball
      # ──────────────────────────────────────────────

      - name: Export image
        shell: bash
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tag }} \
            | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: List artifact
        shell: bash
        run: ls -lh *.tar.gz

      # ──────────────────────────────────────────────
      # Upload artifact
      # ──────────────────────────────────────────────

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}_${{ steps.tags.outputs.tag }}
          path: ${{ env.IMAGE_NAME }}.tar.gz
          retention-days: 7

      # ──────────────────────────────────────────────
      # (Optional) Push to GHCR
      # ──────────────────────────────────────────────

      # Uncomment the lines below and set
      # ACTIONS_STEP_DEBUG / GITHUB_TOKEN permissions
      # if you also want registry push:
